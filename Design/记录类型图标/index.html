<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>喵日记 · 记录类型图标</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Microsoft YaHei",sans-serif;background:#faf9f6;color:#30302e}header,main{max-width:1440px;margin:auto;padding:28px clamp(18px,4vw,56px)}header{padding-bottom:8px}h1{font-size:28px;margin:0 0 8px}p{margin:0;color:#77766f}a{color:#705b1b}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}button,input,select{font:inherit;color:inherit;border:1px solid #e5e3dc;background:white;border-radius:16px;padding:10px 15px}button{cursor:pointer}button[aria-pressed=true]{background:#ffdf7f;border-color:#ccb057;font-weight:bold}.tools{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 0}input{min-width:150px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:14px}.card{margin:0;border:1px solid #e6e4dc;border-radius:20px;background:white;overflow:hidden;text-align:center}.art{display:grid;place-items:center;height:140px;background:repeating-conic-gradient(#f4f3f0 0% 25%,#fff 0% 50%) 50%/16px 16px}.art img{width:112px;height:112px;object-fit:contain}.card figcaption{padding:11px 8px}.card strong{display:block;font-size:14px}.card small{display:block;color:#89877f;font-size:11px}.card a{display:inline-block;font-size:12px;padding:5px}.dark .art{background:repeating-conic-gradient(#282a27 0% 25%,#323430 0% 50%) 50%/16px 16px}.compact .art img{width:48px;height:48px}.compact .art{height:84px}#status{padding:18px 0;font-size:13px}.pending{font-size:12px;color:#8c887b}footer{padding:28px;text-align:center;color:#85827a;font-size:12px}@media(max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}header,main{padding-inline:16px}h1{font-size:24px}.art{height:120px}}
</style>
<header><h1>记录每一个猫咪日常</h1><p>五类模板的手绘贴纸图标 · 透明背景 · 独立素材</p><nav id="groups" aria-label="图标分类"></nav><div class="tools"><input id="search" type="search" placeholder="搜索类型名称" aria-label="搜索类型名称"><select id="display" aria-label="预览方式"><option value="">大图预览</option><option value="compact">实际图标 · 48px</option></select><button id="theme" aria-pressed="false">深色底预览</button><a href="/">打开 App</a></div><p id="status" role="status">正在载入图标…</p></header>
<main><div id="grid" class="grid"></div></main><footer>同名类型共用同一张图标。WebP 用于页面展示，PNG 为生成原图。</footer>
<script type="module">
const manifest=await fetch('./manifest.json').then(r=>r.json());
const order=['note','reminder','expense','symptom','stock'];
const artByName=new Map(manifest.items.map(item=>[item.name,item]));
let selected='all';
const groupNav=document.querySelector('#groups');
for(const [key,label] of [['all','全部素材'],...order.map(key=>[key,manifest.groups[key].label])]){const b=document.createElement('button');b.textContent=label;b.dataset.group=key;b.onclick=()=>{selected=key;render()};groupNav.append(b)}
function render(){const search=document.querySelector('#search').value.trim();const items=(selected==='all'?manifest.items:manifest.groups[selected].items).filter(item=>item.name.includes(search));const grid=document.querySelector('#grid');grid.replaceChildren();for(const item of items){const art=artByName.get(item.name);const card=document.createElement('figure');card.className='card';const well=document.createElement('div');well.className='art';if(art){const img=document.createElement('img');img.src=art.asset;img.alt=item.name;img.width=112;img.height=112;img.loading='lazy';well.append(img)}else{well.textContent='正在制作';well.classList.add('pending')}const caption=document.createElement('figcaption');const name=document.createElement('strong');name.textContent=item.name;caption.append(name);const id=document.createElement('small');id.textContent=item.id||art?.slug||'';caption.append(id);if(art){for(const [label,url] of [['PNG 原图',art.source],['WebP',art.asset]]){const link=document.createElement('a');link.textContent=label;link.href=url;link.download='';caption.append(link)}}card.append(well,caption);grid.append(card)}document.querySelectorAll('#groups button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.group===selected));document.querySelector('#status').textContent=`已生成 ${manifest.generatedCount} / ${manifest.uniqueTypeCount} 张独立图标，覆盖 ${manifest.templateCount} 个模板条目 · 当前显示 ${items.length} 项`;}
document.querySelector('#search').oninput=render;document.querySelector('#display').onchange=e=>document.body.classList.toggle('compact',e.target.value==='compact');document.querySelector('#theme').onclick=e=>{const dark=document.body.classList.toggle('dark');e.target.setAttribute('aria-pressed',dark)};render();
</script>
</html>
