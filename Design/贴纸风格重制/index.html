<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>喵日记 · 贴纸设计集</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#30302e;background:#f7f7f4;color-scheme:light}
*{box-sizing:border-box}body{margin:0}header{padding:34px 5vw 22px;background:#fff;border-bottom:1px solid #e9e9e5}h1{margin:0 0 22px;font-size:28px}h1 span{display:inline-block;font-size:13px;background:#fff1bf;padding:7px 12px;border-radius:15px;vertical-align:middle;margin-left:12px;font-weight:500}nav{display:flex;flex-wrap:wrap;gap:10px}button,a{font:inherit}button{cursor:pointer}nav button{border:1px solid #e3e3df;background:#fff;padding:10px 18px;border-radius:22px;color:inherit}nav button[aria-pressed=true]{background:#ffdf75;border:2px solid #373733;padding:9px 17px}button:focus-visible,a:focus-visible{outline:3px solid #d1a51f;outline-offset:4px}main{padding:26px 5vw 48px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;align-items:start}.grid.boards{grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}.card{display:block;width:100%;padding:0;border:1px solid #e5e5e0;background:#fff;border-radius:16px;overflow:hidden;color:inherit;text-align:left;box-shadow:0 4px 16px #22222204}.card:hover{border-color:#cead39;transform:translateY(-2px)}.card img{display:block;width:100%;height:auto;aspect-ratio:853/1844;object-fit:contain;background:#fff}.card.board img{aspect-ratio:3/2}.card.avatar img{aspect-ratio:1;background:conic-gradient(#f0f0eb 25%,#fff 0 50%,#f0f0eb 0 75%,#fff 0) 0 0/24px 24px}.card span{display:block;padding:14px 16px;font-size:14px;border-top:1px solid #efefeb}footer{padding:8px 5vw 28px;display:flex;gap:24px;font-size:13px}a{color:#6c5819}dialog{border:0;border-radius:18px;padding:14px;background:#f5f5f1;max-width:96vw;max-height:96vh}dialog::backdrop{background:#2229}dialog img{display:block;max-width:90vw;max-height:84vh;object-fit:contain}dialog .bar{display:flex;gap:20px;align-items:center;justify-content:space-between;margin:0 0 12px}dialog h2{font-size:16px;margin:0}dialog button{border:1px solid #ddd;background:#fff;border-radius:20px;padding:6px 14px}dialog a{font-size:13px}@media(max-width:600px){header{padding:24px 20px 18px}h1{font-size:23px}.grid,.grid.boards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid.boards{grid-template-columns:1fr}main{padding:20px}.card span{font-size:12px;padding:12px 10px}nav{gap:8px}nav button{font-size:13px;padding:9px 12px}nav button[aria-pressed=true]{padding:8px 11px}footer{padding-left:20px}}
</style>
</head>
<body>
<header><h1>喵日记 · 贴纸设计集 <span>28 张</span></h1><nav aria-label="设计分类"><button data-group="单页图" aria-pressed="true">单页 · 20</button><button data-group="总览图" aria-pressed="false">总览 · 6</button><button data-group="辅助素材" aria-pressed="false">头像 · 1</button><button data-group="历史参考图" aria-pressed="false">历史版 · 1</button></nav></header>
<main><div class="grid" id="gallery"></div></main>
<footer><a href="../风格探索/home-photo-sticker-v2.png">风格参考</a><a href="manifest.json">生成清单与提示词</a><a href="说明.md">备份说明</a></footer>
<dialog id="viewer"><div class="bar"><h2 id="viewer-title"></h2><a id="original" target="_blank" rel="noopener">打开原尺寸</a><button id="close-viewer" aria-label="关闭预览">关闭</button></div><img id="large-image" alt=""></dialog>
<script>
const cards=[{"path":"单页图/01_首页.png","title":"01 首页","group":"单页图"},{"path":"单页图/02_时光.png","title":"02 时光","group":"单页图"},{"path":"单页图/03_体重趋势.png","title":"03 体重趋势","group":"单页图"},{"path":"单页图/04_宠物档案.png","title":"04 宠物档案","group":"单页图"},{"path":"单页图/05_快捷添加.png","title":"05 快捷添加","group":"单页图"},{"path":"单页图/06_写日记.png","title":"06 写日记","group":"单页图"},{"path":"单页图/07_记录喂食.png","title":"07 记录喂食","group":"单页图"},{"path":"单页图/08_提醒与待办.png","title":"08 提醒与待办","group":"单页图"},{"path":"单页图/09_宠物列表.png","title":"09 宠物列表","group":"单页图"},{"path":"单页图/10_Q版形象编辑.png","title":"10 Q版形象编辑","group":"单页图"},{"path":"单页图/11_疫苗驱虫.png","title":"11 疫苗驱虫","group":"单页图"},{"path":"单页图/12_照片墙.png","title":"12 照片墙","group":"单页图"},{"path":"单页图/13_首次建档.png","title":"13 首次建档","group":"单页图"},{"path":"单页图/14_分享卡片.png","title":"14 分享卡片","group":"单页图"},{"path":"单页图/15_可读资料导出.png","title":"15 可读资料导出","group":"单页图"},{"path":"单页图/16_我的.png","title":"16 我的","group":"单页图"},{"path":"单页图/17_时光宠物筛选.png","title":"17 时光宠物筛选","group":"单页图"},{"path":"单页图/18_外观与显示.png","title":"18 外观与显示","group":"单页图"},{"path":"单页图/19_通知与提醒设置.png","title":"19 通知与提醒设置","group":"单页图"},{"path":"单页图/20_本地数据管理.png","title":"20 本地数据管理","group":"单页图"},{"path":"辅助素材/cat_settings_avatar.png","title":"cat settings avatar","group":"辅助素材"},{"path":"总览图/01_核心页面.png","title":"01 核心页面","group":"总览图"},{"path":"总览图/02_日常记录.png","title":"02 日常记录","group":"总览图"},{"path":"总览图/03_宠物管理.png","title":"03 宠物管理","group":"总览图"},{"path":"总览图/04_首次使用与我的.png","title":"04 首次使用与我的","group":"总览图"},{"path":"总览图/05_时光筛选与宠物列表.png","title":"05 时光筛选与宠物列表","group":"总览图"},{"path":"总览图/06_我的设置结构.png","title":"06 我的设置结构","group":"总览图"},{"path":"历史参考图/04_首次使用与设置_旧版.png","title":"04 首次使用与设置 旧版","group":"历史参考图"}];
const gallery=document.querySelector('#gallery'),viewer=document.querySelector('#viewer');
function show(group){gallery.replaceChildren();gallery.classList.toggle('boards',group==='总览图'||group==='历史参考图');document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.group===group)));for(const card of cards.filter(c=>c.group===group)){const b=document.createElement('button');b.className='card'+(group==='总览图'||group==='历史参考图'?' board':group==='辅助素材'?' avatar':'');const img=document.createElement('img');img.src='../'+card.path;img.alt=card.title;img.loading='eager';const title=document.createElement('span');title.textContent=card.title;b.append(img,title);b.onclick=()=>{document.querySelector('#viewer-title').textContent=card.title;document.querySelector('#large-image').src=img.src;document.querySelector('#large-image').alt=card.title;document.querySelector('#original').href=img.src;viewer.showModal()};gallery.append(b)}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.group));document.querySelector('#close-viewer').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});show('单页图');
</script>
</body></html>
