<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>喵日记 · 单页设计对照</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.65 "Microsoft YaHei",sans-serif;color:#292925;background:#f7f6f2}header{padding:28px clamp(20px,4vw,64px);background:white;border-bottom:1px solid #e6e5e0}h1{font-size:27px;margin:0 0 8px}p{margin:0;color:#777}a{color:#655414}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}button,select{font:inherit;background:#fff;border:1px solid #deddd7;border-radius:12px;padding:9px 14px;color:inherit}button{cursor:pointer}button:hover{background:#fff0b6}select{max-width:100%}main{padding:24px clamp(20px,4vw,64px)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}figure{margin:0;background:white;border:1px solid #e6e5e0;border-radius:18px;padding:15px;min-width:0}figcaption{margin-bottom:14px;font-weight:bold}figure img{display:block;max-width:100%;height:auto;margin:auto}#reference{width:375px}#implementation{width:375px}.index{margin-top:30px;display:flex;gap:8px;flex-wrap:wrap}.index button[aria-pressed=true]{background:#ffdc69;border-color:#292925}small{font-size:12px;color:#888}@media(max-width:600px){.compare{gap:10px}figure{padding:7px}figcaption{font-size:12px}main{padding:15px 8px}header{padding:20px 16px}nav{gap:7px}button,select{padding:7px;font-size:13px}}
</style>
<header><h1>喵日记 · 单页设计对照</h1><p>设计图与实际浏览器截图并排查看。界面使用独立测试数据；手机端保持单列，宽屏展开布局。</p><small>原图中的系统状态栏不属于网页。第 13 张旧建档图由第 21–33 张猫咪建档流程取代。</small><nav><button id="previous">← 上一页</button><select id="page" aria-label="选择页面"></select><button id="next">下一页 →</button><select id="size" aria-label="选择屏幕宽度"><option value="full">手机长图 · 375px</option><option value="375">手机 · 375px</option><option value="320">小屏 · 320px</option><option value="768">平板 · 768px</option><option value="1440">桌面 · 1440px</option></select><a href="/" target="_blank">打开 App</a></nav></header>
<main><p style="margin-bottom:16px">第 05 页新增记录已按最新要求恢复原版：记事、提醒、记账、体征、囤货五类选择面板。<a href="/Design/记录类型图标/index.html">浏览全部记录类型图标 →</a></p><div class="compare"><figure><figcaption id="ref-title">设计图</figcaption><img id="reference" alt="原始单页设计"></figure><figure><figcaption id="impl-title">实际页面</figcaption><img id="implementation" alt="浏览器实测截图"></figure></div><div class="index" id="index"></div></main>
<script>
const pages=[
['01_首页','01-home'],['02_时光','02-timeline'],['03_体重趋势','03-weight'],['04_宠物档案','04-profile'],['05_快捷添加','05-quick-add',true],['06_写日记','06-diary'],['07_记录喂食','07-food'],['08_提醒与待办','08-reminders'],['09_宠物列表','09-cats'],['10_Q版形象编辑','10-appearance'],['11_疫苗驱虫','11-health'],['12_照片墙','12-photos'],['14_分享卡片','14-share'],['15_可读资料导出','15-export'],['16_我的','16-me'],['17_时光宠物筛选','17-filter',true],['18_外观与显示','18-display'],['19_通知与提醒设置','19-notifications'],['20_本地数据管理','20-storage'],
['21_猫咪建档_开始','21-welcome'],['22_猫咪建档_基本资料','22-basics'],['23_猫咪建档_头像选择','23-avatar'],['24_猫咪建档_照片裁剪','24-crop'],['25_猫咪建档_品种选择','25-breed'],['26_猫咪建档_生日与到家日','26-dates'],['27_猫咪建档_日期选择','27-date'],['28_猫咪建档_健康资料','28-health'],['29_猫咪建档_档案确认','29-review'],['30_猫咪建档_建档完成','30-success'],['31_猫咪建档_名字未填校验','31-name-error'],['32_猫咪建档_退出确认','32-exit'],['33_猫咪建档_保存失败','33-save-error']
];
const picker=document.querySelector('#page'),size=document.querySelector('#size');
pages.forEach(([name],i)=>{picker.add(new Option(name.replaceAll('_',' · '),i));const b=document.createElement('button');b.textContent=name.slice(0,2);b.title=name;b.onclick=()=>{picker.value=i;render()};document.querySelector('#index').append(b)});
function render(){const index=Number(picker.value),[name,file,sheet]=pages[index],onboarding=index>=19;const width=size.value==='full'?375:Number(size.value);document.querySelector('#reference').src='../Design/单页图/'+encodeURIComponent(name)+'.png';const actual=onboarding?'screenshots/cat-'+file+'.png':'alignment/'+(size.value==='full'&&!sheet?'full':size.value==='full'?'375':size.value)+'-'+file+'.png';const img=document.querySelector('#implementation');img.src=actual;img.style.width=onboarding?'375px':width+'px';document.querySelector('#ref-title').textContent=name.replaceAll('_',' · ');document.querySelector('#impl-title').textContent=onboarding?'实际建档流程 · 375px':size.options[size.selectedIndex].text;document.querySelectorAll('#index button').forEach((b,i)=>b.setAttribute('aria-pressed',i===index));size.disabled=onboarding;document.querySelector('#previous').disabled=index===0;document.querySelector('#next').disabled=index===pages.length-1;}
picker.onchange=render;size.onchange=render;document.querySelector('#previous').onclick=()=>{picker.value=Number(picker.value)-1;render()};document.querySelector('#next').onclick=()=>{picker.value=Number(picker.value)+1;render()};render();
</script>
</html>
